  ЖЛ:
    full: "жим лёжа"
    en: "bench press"
  ЖС:
    full: "жим стоя / армейский жим"
    en: "overhead press"
  ЖН:
    full: "жим ногами"
    en: "leg press"
  ПР:
    full: "приседания"
    en: "squat"
  СТ:
    full: "становая тяга"
    en: "deadlift"
  РП:
    full: "разведение / пек-дек"
    en: "pec deck / fly"
  ФП:
    full: "французский жим"
    en: "skull crusher / french press"
  ПВ:
    full: "подъём на возвышение"
