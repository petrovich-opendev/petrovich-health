# Workout Abbreviation Glossary — adaptive, auto-enriched
# Bot reads this before LLM parsing. Unknown terms get added to unknown_terms list.
# User confirms → glossary grows.

# --- Effort / RPE levels ---
effort_levels:
  ЛГ:
    full: "легко"
    en: "easy"
    rpe: "5-6"
  СР:
    full: "средне"
    en: "moderate"
    rpe: "7-8"
  ТЖ:
    full: "тяжело"
    en: "hard"
    rpe: "9"
  СМСТ:
    full: "средне-сложно"
    en: "moderate-hard"
    rpe: "8"
  отказ:
    full: "до мышечного отказа"
    en: "to failure"
    rpe: "10"

# --- Rep quality modifiers ---
rep_modifiers:
  Ф:
    full: "с фиксатором / помощью"
    en: "assisted / fixed"
  Ч:
    full: "чистый (строгая техника)"
    en: "strict form"
  Ж:
    full: "жимовой (с инерцией жима)"
    en: "push-assisted"
  К:
    full: "с читингом / кривой"
    en: "cheat rep"
  "0":
    full: "без дополнительного веса"
    en: "bodyweight only"
  М:
    full: "максимум / до отказа"
    en: "to failure / max reps"

# --- Grip types ---
grip_types:
  ШХ:
    full: "широкий хват"
    en: "wide grip"
  НХ:
    full: "нейтральный хват"
    en: "neutral grip"
  УХ:
    full: "узкий хват"
    en: "close grip"
  ОХ:
    full: "обратный хват"
    en: "reverse grip"
  ПХ:
    full: "прямой хват"
    en: "pronated grip"

# --- Exercise abbreviations ---
exercise_abbrevs:
  ГТ:
    full: "горизонтальная тяга"
    en: "seated cable row"
  ВТ:
    full: "вертикальная тяга"
    en: "lat pulldown"
  ПНБ:
