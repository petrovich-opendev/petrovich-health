    en: "leg raise"
  ИП:
    full: "икры в платформе / подъёмы на носки"
    en: "calf raise"

# --- Equipment / stance modifiers ---
equipment:
  СВ:
    full: "свободный вес"
    en: "free weight"
  БЛ:
    full: "блочный тренажёр"
    en: "cable machine"
  ГА:
    full: "гантели"
    en: "dumbbells"
  ШТ:
    full: "штанга"
    en: "barbell"
  РЗ:
    full: "резина / эспандер"
    en: "resistance band"

# --- Set notation patterns ---
set_notation:
  "2С|3П":
    full: "2 суперсета по 3 подхода"
    en: "2 supersets of 3 sets"
  "х3":
    full: "3 подхода (одинаковых)"
    en: "3 sets (same)"
  "+25кг/10":
    full: "+25 кг на 10 повторений"
    en: "+25 kg for 10 reps"
  "10 х3":
    full: "10 повторений, 3 подхода"
    en: "10 reps, 3 sets"

# --- Muscle groups (Russian → English canonical) ---
muscle_groups:
  СПИНА: "back"
  ГРУДЬ: "chest"
  НОГИ: "legs"
  ПЛЕЧИ: "shoulders"
  БИЦЕПС: "biceps"
  ТРИЦЕПС: "triceps"
  ПРЕСС: "abs"
  ПРЕДПЛЕЧЬЯ: "forearms"
  ИКРЫ: "calves"
  ЯГОДИЦЫ: "glutes"
  ТРАПЕЦИЯ: "traps"
  ДЕЛЬТЫ: "delts"

# --- Technique / tempo modifiers ---
technique:
  СМВ:
    full: "статодинамика медленных волокон (метод Селуянова) — малый вес 20-60% 1RM, медленный темп, 15-25 повторов, 40-50 сек под нагрузкой"
    en: "slow muscle fiber training (Seluyanov method) — slow tempo, partial ROM, constant tension"
  "4ст":
    full: "4 ступени — дропсет/стрип-сет со снижением веса на ~20% за ступень, без паузы"
    en: "4-step drop set — reduce weight ~20% each step, no rest"
  пружина:
    full: "пружинящие движения в конечной точке амплитуды"
    en: "bouncing/pulsing reps at end range"

# --- Stance / position modifiers ---
stance:
  "А/М":
    full: "регулировка валика/сиденья — размер A или M"
    en: "pad/seat adjustment — size A or M"
  "B/XL":
    full: "регулировка валика/сиденья — размер B или XL"
    en: "pad/seat adjustment — size B or XL"
  СВОБОДНО:
    full: "свободный вес (не в тренажёре)"
    en: "free weight (not machine)"

# --- Section markers ---
section_markers:
  РАЗМИНКА: "warmup"
  ЗАМИНКА: "cooldown"
  РАСТЯЖКА: "stretching"
  КАРДИО: "cardio"

# --- Day abbreviations ---
days:
  ПН: "понедельник"
  ВТ: "вторник"
  СР: "среда"
  ЧТ: "четверг"
  ПТ: "пятница"
  СБ: "суббота"
  ВС: "воскресенье"
