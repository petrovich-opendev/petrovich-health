# Nutrient interaction matrix — antagonisms and synergies
# Evidence: Cambridge British Journal of Nutrition, PMC reviews
# Each interaction: type (antagonist/synergist), mechanism, timing advice

antagonists:
  - pair: [calcium, iron]
    type: antagonist
    mechanism: "Ca конкурирует за DMT1 транспортёр в кишечнике"
    advice: "Разнести на 2+ часа. Железо утром натощак с вит С, кальций вечером"
    evidence: "A"

  - pair: [zinc, copper]
    type: antagonist
    mechanism: "Zn индуцирует металлотионеин в энтероцитах, который связывает Cu"
    advice: "Zn > 50мг/день → дефицит Cu за 20 недель. При длительном Zn добавлять Cu 1-2мг"
    evidence: "A"

  - pair: [zinc, iron]
    type: antagonist
    mechanism: "Конкуренция за DMT1 при приёме натощак"
    advice: "Не принимать вместе натощак. С едой — взаимодействие минимально"
    evidence: "B"

  - pair: [calcium, zinc]
    type: antagonist
    mechanism: "Высокие дозы Ca снижают абсорбцию Zn"
    advice: "Разнести приём"
    evidence: "B"

  - pair: [calcium, magnesium]
    type: antagonist
    mechanism: "Конкуренция за абсорбцию при высоких дозах (>500мг Ca)"
    advice: "Ca и Mg в разные приёмы. Mg вечером (расслабляет), Ca с едой"
    evidence: "B"

  - pair: [iron, tea_coffee]
    type: antagonist
    mechanism: "Танины и полифенолы хелатируют железо в ЖКТ, снижая абсорбцию на 60-90%"
    advice: "Не пить чай/кофе за 1ч до и 2ч после приёма железа"
    evidence: "A"

  - pair: [iron, phytates]
    type: antagonist
    mechanism: "Фитиновая кислота (крупы, бобовые, орехи) связывает железо"
    advice: "Замачивание/ферментация снижает фитаты. Вит С компенсирует"
    evidence: "A"

synergists:
  - pair: [vitamin_c, iron]
    type: synergist
    mechanism: "Аскорбат восстанавливает Fe3+ → Fe2+ (усвояемая форма)"
    advice: "75-100мг вит С вместе с железом повышает абсорбцию в 2-3 раза"
    evidence: "A"

  - pair: [vitamin_d, calcium]
    type: synergist
    mechanism: "D3 стимулирует экспрессию кальбиндина → абсорбция Ca"
    advice: "При дефиците D кальций плохо усваивается"
    evidence: "A"

  - pair: [vitamin_d, magnesium]
    type: synergist
    mechanism: "Mg необходим для гидроксилирования D3 → 25-OH-D → 1,25-OH2-D"
    advice: "Дефицит Mg = витамин D не активируется. Сначала Mg, потом D"
    evidence: "B"

  - pair: [vitamin_k2, vitamin_d]
    type: synergist
    mechanism: "K2 активирует остеокальцин и MGP, направляя Ca в кости (не в сосуды)"
    advice: "При приёме D3 > 4000 МЕ добавлять K2 (MK-7) 100-200 мкг"
    evidence: "B"

  - pair: [vitamin_b12, folate]
    type: synergist
    mechanism: "Работают вместе в метаболизме гомоцистеина (метионин-синтаза)"
    advice: "Дефицит одного маскирует дефицит другого. Проверять оба + гомоцистеин"
    evidence: "A"

  - pair: [copper, iron]
    type: synergist
    mechanism: "Церулоплазмин (Cu-зависимый) окисляет Fe2+ → Fe3+ для загрузки в трансферрин"
    advice: "Дефицит Cu → анемия даже при нормальном железе"
    evidence: "B"

  - pair: [selenium, vitamin_e]
    type: synergist
    mechanism: "Оба антиоксиданта, Se в глутатионпероксидазе, E ловит радикалы в мембранах"
    advice: "Работают эффективнее вместе"
    evidence: "B"

# ── Drug-nutrient depletions ──
drug_depletions:
  metformin:
    depletes: [vitamin_b12, folate]
    mechanism: "Нарушает Ca-зависимый транспорт B12 в подвздошной кишке"
    monitoring: "B12 каждые 6 мес. Гомоцистеин. При дефиците — B12 сублингвально или инъекции"
    evidence: "A"

  proton_pump_inhibitors:
    drugs: [omeprazole, pantoprazole, esomeprazole]
    depletes: [magnesium, vitamin_b12, calcium, iron]
    mechanism: "Снижение кислотности → нарушение абсорбции минералов и B12"
    monitoring: "Mg, B12 ежегодно при длительном приёме. Fe при анемии"
    evidence: "A"

  statins:
    drugs: [atorvastatin, rosuvastatin]
    depletes: [coq10]
    mechanism: "Ингибирование HMG-CoA редуктазы → снижение синтеза CoQ10"
    monitoring: "CoQ10 100-200мг/день при приёме статинов. Миалгия = маркер"
    evidence: "B"

  oral_contraceptives:
    depletes: [vitamin_b6, folate, magnesium, zinc, vitamin_c]
    mechanism: "Множественные пути: повышенный метаболизм, снижение абсорбции"
    monitoring: "Фолат обязателен, остальное по показаниям"
    evidence: "B"

  corticosteroids:
    drugs: [prednisone, dexamethasone]
    depletes: [calcium, vitamin_d, potassium, magnesium]
    mechanism: "Снижение абсорбции Ca, повышение экскреции"
    monitoring: "Кальций + D3 обязательно. Денситометрия при длительном приёме"
    evidence: "A"

# ── Drug-GI interactions ──
drug_gi_effects:
  glp1_agonists:
    drugs: [semaglutide, tirzepatide, liraglutide]
    gi_effects:
      nausea: "44% (тирзепатид выше)"
      constipation: "24%"
      diarrhea: "30%"
      vomiting: "24%"
    mechanism: "Замедление опорожнения желудка (vagal inhibition) + центральная супрессия аппетита"
    prevention:
      - "Медленная титрация дозы (каждые 4 нед, не 2)"
      - "Клетчатка 25-30г/день (растворимая: псиллиум)"
      - "Магний цитрат 400-600мг/день (слабительный эффект)"
      - "Вода ≥ 2.5л/день"
      - "Мелкие частые приёмы пищи"
      - "Исключить жирную/жареную пищу при тошноте"
    serious_risks:
      - "Панкреатит (редко, <1%). Сильная боль в животе → скорая"
      - "Кишечная непроходимость (case reports). Длительный запор без лечения → хирургия"
      - "Анальные трещины при хроническом запоре — до 20% хронических запоров"
    evidence: "A"

  nsaids:
    drugs: [ibuprofen, diclofenac, naproxen]
    gi_effects:
      gastritis: "15-30%"
      ulcers: "1-4% при длительном приёме"
    prevention:
      - "Принимать с едой"
      - "PPI при длительном приёме"
      - "Не сочетать с алкоголем"
    evidence: "A"

  oral_anabolics:
    drugs: ["17α-алкилированные: оксандролон, станозолол, метандиенон"]
    gi_effects:
      hepatotoxicity: "доза-зависимая"
      cholestasis: "при длительном приёме"
    mechanism: "Первый печёночный метаболизм → прямое повреждение гепатоцитов"
    prevention:
      - "Ограничить курс до 6-8 недель"
      - "УДХК (урсодезоксихолевая кислота) 500мг/день"
      - "NAC 600мг 2р/день"
      - "Контроль АЛТ/АСТ каждые 2 недели"
    evidence: "B"

# ── Drug-food interactions (CYP inhibitors/inducers) ──
drug_food_interactions:
  grapefruit_cyp3a4:
    foods: ["грейпфрут", "грейпфрутовый сок", "помело", "бигарадия (кислые апельсины)"]
    mechanism: "Фуранокумарины блокируют CYP3A4 в стенке кишечника на 24-72ч → экспозиция препаратов ↑ до 2-5×"
    affected_drugs:
      - "Статины (аторва, симва — сильно; розува — слабее)"
      - "Блокаторы Ca каналов (нифедипин, фелодипин, верапамил)"
      - "Циклоспорин, такролимус"
      - "Бензодиазепины (диазепам, мидазолам)"
      - "Эритромицин, кларитромицин"
      - "Силденафил, тадалафил"
      - "Амиодарон"
      - "Дронедарон"
    advice: "Полностью исключить при приёме любого CYP3A4-субстрата. Даже один стакан сока действует сутки"
    evidence: "A"

  st_johns_wort:
    foods: ["Зверобой продырявленный (Hypericum perforatum)"]
    mechanism: "Мощный индуктор CYP3A4, CYP2C9, P-gp — снижает плазменные уровни препаратов"
    affected_drugs:
      - "Варфарин (снижение эффекта)"
      - "Оральные контрацептивы (отказ, беременность!)"
      - "Циклоспорин, такролимус"
      - "Дигоксин"
      - "Антидепрессанты (в т.ч. серотониновый синдром)"
    advice: "Проверить все параллельные препараты. Эффект сохраняется 2 недели после отмены"
    evidence: "A"

  levothyroxine_interactions:
    drug: "L-тироксин / эутирокс / L-T4"
    interactions:
      food: "Приём натощак, минимум 30-60 мин до завтрака"
      cavsFe: "Не принимать с Ca/Fe/Mg препаратами — washout 4 часа. Образуют хелаты, блокируют абсорбцию до 70%"
      coffee: "Кофе снижает абсорбцию на 30% — washout 1 час"
      food_generally: "Пища снижает абсорбцию — почему натощак"
      ppi: "ИПП снижают абсорбцию на 10-20% (повышение pH)"
      soy: "Соевые продукты — снижают абсорбцию"
    advice: "Фиксированное время приёма — КРИТИЧНО для стабильного ТТГ. Любое изменение режима → повторный TSH через 6 недель"
    evidence: "A"

  hepatotoxic_drugs_warning:
    description: "При АЛТ/АСТ >3× нормы ИЗБЕГАТЬ или прекратить"
    drugs:
      paracetamol: "Максимально 2г/сут при компенсированной печени, 0 при АЛТ>3×. Самая частая причина острой печёночной недостаточности"
      statins: "0.5-2% случаев ↑ АЛТ. При АЛТ>3× — отменить, переоценить через 2 нед"
      amiodarone: "25% пациентов — ↑ АЛТ. Фосфолипидоз + цирроз при длительном приёме"
      methotrexate: "Хроническая гепатотоксичность, фиброз. Мониторинг ФПП ежемесячно, фолиевая 5мг/нед обязательна"
      isoniazid: "10-20% ↑ АЛТ, 1% клинический гепатит. N-acetyltransferase медленные ацетиляторы — выше риск"
      nitrofurantoin: "Хронический гепатит при длительной профилактике (>6 мес)"
      valproate: "Прямая митохондриальная токсичность, особенно у детей"
      tamoxifen: "НАЖБП, стеатогепатит у 30% при длительном приёме"
      alcohol: "С любым из выше — синергия, многократное усиление гепатотокс."
    evidence: "A"

  nephrotoxic_drugs:
    description: "При eGFR <60 или креатинине выше нормы — коррекция или замена"
    drugs:
      - "НПВС (ибупрофен, диклофенак) — острое ишемическое поражение при дегидратации"
      - "Аминогликозиды (гентамицин, амикацин)"
      - "Контраст иодированный — гидратация обязательна"
      - "АПФ-ингибиторы + НПВС — синергия, двойной удар"
      - "Ванкомицин (при уровне >20 мг/л)"
      - "Циклоспорин, такролимус"
      - "Литий"
      - "Тенофовир (старая форма TDF, не TAF)"
    evidence: "A"

  qt_prolonging_drugs:
    description: "При исходно QTc >440 (муж.) / >460 (жен.) ИЗБЕГАТЬ сочетаний"
    drugs:
      antiarrhythmics: ["амиодарон", "соталол", "хинидин", "дронедарон"]
      antibiotics:     ["азитромицин", "кларитромицин", "моксифлоксацин", "ципрофлоксацин"]
      antipsychotics:  ["галоперидол", "зипрасидон", "кветиапин"]
      antidepressants: ["циталопрам", "эсциталопрам >20 мг"]
      antiemetics:     ["ондансетрон", "домперидон"]
      other:           ["метадон", "гидроксизин", "диуретики петлевые (через гипокалиемию)"]
    risk_factors:
      - "Гипокалиемия < 3.5 (петлевые диуретики, ГР, рвота)"
      - "Гипомагниемия"
      - "Брадикардия"
      - "Женский пол"
      - "Возраст > 65"
    advice: "При сочетании 2+ QT-препаратов или факторов риска — контроль ЭКГ через 7 дней после начала"
    evidence: "A"

  warfarin_interactions:
    drug: "Варфарин"
    synergy: "Усиливают (↑ МНО, риск кровотечения):"
    enhancers:
      - "НПВС (все)"
      - "Аспирин"
      - "Амиодарон (резко)"
      - "Метронидазол, TMP-SMX, ципро"
      - "Флуконазол"
      - "SSRI (через тромбоциты)"
      - "Алкоголь острый"
      - "Тестостерон (↑ эффект варфарина)"
      - "Витамин E высокодозный (>400 МЕ)"
      - "Клюквенный сок"
    antagonists: "Снижают (↓ МНО):"
    reducers:
      - "Витамин K (продукты: капуста, шпинат, брокколи — стабильное потребление)"
      - "Зверобой"
      - "Рифампицин"
      - "Барбитураты"
      - "Алкоголь хронический"
    advice: "Любое изменение параллельной терапии → контроль МНО через 3-5 дней"
    evidence: "A"

  serotonergic_syndrome:
    description: "Сочетание препаратов, повышающих серотонин → угрожающее состояние"
    drugs:
      - "SSRI (сертралин, флуоксетин, эсциталопрам)"
      - "SNRI (венлафаксин, дулоксетин)"
      - "Трициклики (амитриптилин)"
      - "Триптаны (суматриптан) — при мигрени"
      - "Линезолид (антибиотик — МАО-ингибитор)"
      - "Трамадол"
      - "MDMA, LSD, psilocybin"
      - "5-HTP, L-триптофан высокодозные"
      - "Зверобой"
    symptoms: "Гипертермия, клонус, возбуждение, ригидность"
    advice: "Любые 2 из выше — избегать. Wash-out между SSRI и МАО — 2-5 недель"
    evidence: "A"

  grapefruit_safe_alternatives:
    note: "Если нужен сок — подойдут: яблочный, виноградный (не белый грейпфрут), апельсиновый (обычный, не севильский)"
