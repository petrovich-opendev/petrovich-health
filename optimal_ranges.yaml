# Optimal ranges vs lab reference ranges
# Based on: functional medicine literature, clinical studies, biohacking research
# Each entry: lab_ref (standard), optimal (evidence-based target), notes, evidence_level

ranges:
  # ── Vitamins ──
  vitamin_d_25oh:
    name: "Витамин D (25-OH)"
    unit: нг/мл
    lab_ref: [30, 100]
    optimal: [50, 70]
    critical_low: 20
    evidence: "B"
    notes: "Ниже 50 — снижен ответ на ГР (IGF-1). При повреждении печени (АЛТ>3x) проверять также 1,25-OH2-D — конверсия может быть нарушена"
    interactions:
      - "Магний необходим для активации (гидроксилирования)"
      - "ГР повышает потребность в D"
      - "Печёночная дисфункция нарушает 25-гидроксилирование"

  vitamin_b12:
    name: "Витамин B12"
    unit: пг/мл
    lab_ref: [200, 900]
    optimal: [500, 800]
    critical_low: 300
    evidence: "B"
    notes: "Метформин истощает B12. Дефицит может быть при нормальном B12 — проверять гомоцистеин и метилмалоновую кислоту"

  folate:
    name: "Фолат (B9)"
    unit: нг/мл
    lab_ref: [3, 20]
    optimal: [10, 20]
    evidence: "B"
    notes: "Работает в связке с B12. Дефицит повышает гомоцистеин"

  # ── Iron metabolism ──
  ferritin:
    name: "Ферритин"
    unit: нг/мл
    lab_ref_male: [12, 300]
    optimal_male: [80, 150]
    optimal_female: [50, 100]
    critical_low: 30
    evidence: "B"
    notes: "Ниже 30 — ранний дефицит железа даже при нормальном гемоглобине. Выше 300 — исключить гемохроматоз, воспаление (острофазовый белок). На ТЗТ при флеботомии — железо истощается"

  iron_serum:
    name: "Железо сывороточное"
    unit: мкмоль/л
    lab_ref: [9, 30]
    optimal: [15, 25]
    evidence: "B"
    notes: "Не принимать с кальцием, кофе, чаем (танины). Принимать с витамином С для усвоения"

  transferrin_saturation:
    name: "Насыщение трансферрина"
    unit: "%"
    lab_ref: [20, 50]
    optimal: [25, 40]
    evidence: "B"
    notes: "Ниже 20% — функциональный дефицит железа. Выше 45% — скрининг гемохроматоза"

  # ── Liver ──
  alt:
    name: "АЛТ"
    unit: Ед/л
    lab_ref: [0, 41]
    optimal: [10, 25]
    evidence: "B"
    notes: "Выше 3x нормы — серьёзное повреждение гепатоцитов. Причины на ТЗТ/ГР: гепатотоксичность оральных АС (17α-алкилированных), НАЖБП, фенибут, статины. Влияет на конверсию витамина D"

  ast:
    name: "АСТ"
    unit: Ед/л
    lab_ref: [0, 40]
    optimal: [10, 25]
    evidence: "B"
    notes: "АСТ/АЛТ > 2 = алкогольное поражение или цирроз. АСТ может быть из мышц (после тяжёлой тренировки) — ≥48ч отдыха перед сдачей"

  ggt:
    name: "ГГТ"
    unit: Ед/л
    lab_ref: [0, 55]
    optimal: [10, 30]
    evidence: "B"
    notes: "Ранний маркер алкогольного/токсического поражения печени. Повышается раньше АЛТ/АСТ"

  bilirubin_total:
    name: "Билирубин общий"
    unit: мкмоль/л
    lab_ref: [3.4, 20.5]
    optimal: [5, 15]
    evidence: "B"
    notes: "Постоянно выше 17 без других изменений — вероятно синдром Жильбера (доброкачественный, 5-10% популяции)"

  # ── Kidney ──
  creatinine:
    name: "Креатинин"
    unit: мкмоль/л
    lab_ref_male: [62, 115]
    optimal_male: [70, 100]
    evidence: "B"
    notes: "КРИТИЧЕСКИ ВАЖНО: на ТЗТ + высокобелковой диете + креатин = креатинин повышен НЕ из-за почек. Для дифференциации ОБЯЗАТЕЛЬНО цистатин С. Ложная тревога на eGFR — обычное дело у мышечных людей"
    interactions:
      - "Мышечная масса повышает базовый уровень"
      - "Высокобелковая диета повышает на 10-20%"
      - "Креатин моногидрат повышает"
      - "ТЗТ увеличивает мышечную массу → повышает"

  cystatin_c:
    name: "Цистатин С"
    unit: мг/л
    lab_ref: [0.55, 1.15]
    optimal: [0.6, 0.9]
    evidence: "A"
    notes: "Золотой стандарт оценки почек при высокой мышечной массе. НЕ зависит от мышц, белка, пола"

  uric_acid:
    name: "Мочевая кислота"
    unit: мкмоль/л
    lab_ref_male: [200, 420]
    optimal_male: [200, 350]
    evidence: "B"
    notes: "Выше 360 — риск подагры. ТЗТ может повышать. Фруктоза повышает"

  # ── Hormones ──
  testosterone_total:
    name: "Тестостерон общий"
    unit: нмоль/л
    lab_ref_male: [8.6, 29]
    optimal_male: [20, 30]
    evidence: "B"
    notes: "На ТЗТ — забор через 48-72ч после инъекции (trough). Доза 100мг/нед ≈ 12-18 нмоль/л, 200мг/нед ≈ 24-36 нмоль/л (±30% индивидуально)"

  estradiol:
    name: "Эстрадиол (E2)"
    unit: пг/мл
    lab_ref_male: [11, 43]
    optimal_male: [20, 35]
    critical_high: 50
    evidence: "B"
    notes: "AI (анастрозол) ТОЛЬКО по анализам, не профилактически. E2 < 20 = убитый эстрадиол — суставы, либидо, кости, настроение. Жировая ткань усиливает ароматизацию. Цинк ингибирует ароматазу"

  shbg:
    name: "ГСПГ (SHBG)"
    unit: нмоль/л
    lab_ref_male: [18, 54]
    optimal_male: [20, 40]
    evidence: "B"
    notes: "Низкий SHBG = больше свободного тестостерона при той же общей дозе. Магний и бор снижают SHBG. Инсулинорезистентность снижает SHBG"

  igf1:
    name: "ИФР-1 (IGF-1)"
    unit: нг/мл
    lab_ref_age_40_50: [94, 252]
    optimal: [200, 300]
    critical_high: 400
    evidence: "B"
    notes: "Основной маркер ответа на ГР. Выше 400 — снизить дозу (онкориск). Витамин D необходим для полного ответа. Проверять через 4-6 нед после старта/смены дозы ГР"

  tsh:
    name: "ТТГ"
    unit: мМЕ/л
    lab_ref: [0.4, 4.0]
    optimal: [0.5, 2.0]
    evidence: "B"
    notes: "ГР снижает конверсию T4→T3, ТТГ может быть в норме при субклиническом гипотиреозе. Проверять свободный Т3 и Т4 вместе с ТТГ"

  prolactin:
    name: "Пролактин"
    unit: нг/мл
    lab_ref_male: [4, 15]
    optimal_male: [5, 12]
    evidence: "B"
    notes: "Высокие дозы тестостерона, нандролон, тренболон могут повышать. Выше 30 — каберголин 0.25мг 2р/нед. GHRP-2/GHRP-6 повышают"

  # ── Blood ──
  hematocrit:
    name: "Гематокрит"
    unit: "%"
    lab_ref_male: [40, 54]
    optimal_male: [42, 49]
    critical_high: 54
    evidence: "A"
    notes: "ТЗТ повышает (4x риск эритроцитоза). Выше 54% — риск тромбоза. Флеботомия спорна (истощает железо, запускает компенсаторный эритропоэз). Альтернативы: снижение дозы, более частые инъекции (стабильнее уровень), грейпфрут/нарингин (слабые данные). Обезвоживание = ложное повышение"

  hemoglobin:
    name: "Гемоглобин"
    unit: г/л
    lab_ref_male: [130, 170]
    optimal_male: [140, 160]
    evidence: "A"
    notes: "Коррелирует с гематокритом. На ТЗТ следить вместе"

  # ── Metabolic ──
  glucose_fasting:
    name: "Глюкоза натощак"
    unit: ммоль/л
    lab_ref: [3.9, 6.1]
    optimal: [4.0, 5.2]
    critical_high: 6.1
    evidence: "A"
    notes: "ГР — контринсулярный гормон, повышает глюкозу. MK-677 особенно. Контроль каждые 3 мес на ГР"

  hba1c:
    name: "HbA1c"
    unit: "%"
    lab_ref: [4.0, 6.0]
    optimal: [4.5, 5.3]
    critical_high: 5.7
    evidence: "A"
    notes: "Золотой стандарт долгосрочного контроля глюкозы. Выше 5.7% = преддиабет"

  insulin_fasting:
    name: "Инсулин натощак"
    unit: мкМЕ/мл
    lab_ref: [2.6, 24.9]
    optimal: [3, 8]
    critical_high: 15
    evidence: "B"
    notes: "Выше 10 — ранняя инсулинорезистентность. ГР и MK-677 повышают. HOMA-IR = глюкоза × инсулин / 22.5; > 2.5 = IR"

  crp_hs:
    name: "С-реактивный белок (высокочувствительный)"
    unit: мг/л
    lab_ref: [0, 5]
    optimal: [0, 1.0]
    evidence: "A"
    notes: "Выше 1.0 — системное воспаление. Выше 3.0 — высокий кардиориск. Тренировка за 48ч до сдачи даёт ложное повышение"

  homocysteine:
    name: "Гомоцистеин"
    unit: мкмоль/л
    lab_ref: [5, 15]
    optimal: [5, 8]
    evidence: "B"
    notes: "Выше 10 — кардио/нейрориск. Снижается B12 + B6 + фолатом. Маркер функционального дефицита B-витаминов"

  # ── Thyroid (free fractions required — TSH alone insufficient) ──
  free_t4:
    name: "Т4 свободный (fT4)"
    unit: пмоль/л
    lab_ref: [9, 22]
    optimal: [14, 19]
    evidence: "B"
    notes: "ГР снижает конверсию Т4→Т3, fT4 может быть высоким при нормальном ТТГ. Без fT4 нельзя оценить центральный гипотиреоз"

  free_t3:
    name: "Т3 свободный (fT3)"
    unit: пмоль/л
    lab_ref: [2.6, 5.7]
    optimal: [4.0, 5.5]
    evidence: "B"
    notes: "Активная форма, работает на тканях. На ГР часто низковат → усталость при норме ТТГ и fT4. Селен + цинк нужны для конверсии. Кортизол высокий → блок конверсии"

  reverse_t3:
    name: "Реверсивный Т3 (rT3)"
    unit: нг/дл
    lab_ref: [9, 24]
    optimal: [10, 17]
    evidence: "C"
    notes: "Высокий rT3 при стрессе/дефиците калорий/воспалении — блокирует рецепторы. Ratio fT3/rT3 > 0.2 = здорово"

  # ── Parathyroid / Ca-P axis ──
  pth:
    name: "ПТГ (паратгормон, intact)"
    unit: пг/мл
    lab_ref: [15, 65]
    optimal: [20, 45]
    critical_high: 80
    evidence: "A"
    notes: "ВСЕГДА смотрим вместе с Ca и витамином D. Высокий ПТГ + низкий Ca+D = вторичный гиперпаратиреоз. Высокий ПТГ + высокий Ca = первичный (аденома паращитовидной). Низкий ПТГ + низкий Ca = гипопаратиреоз"

  calcium_total:
    name: "Кальций общий"
    unit: ммоль/л
    lab_ref: [2.15, 2.55]
    optimal: [2.25, 2.45]
    evidence: "A"
    notes: "НЕ интерпретируется без альбумина. Corrected Ca = total Ca + 0.02 × (40 − альбумин_г/л). При гипоальбуминемии total Ca занижен, истина — ионизированный Ca или corrected"

  calcium_ionized:
    name: "Кальций ионизированный"
    unit: ммоль/л
    lab_ref: [1.15, 1.30]
    optimal: [1.18, 1.28]
    evidence: "A"
    notes: "Золотой стандарт для Ca-P статуса. Не зависит от альбумина. Сдавать в той же пробирке что и ПТГ, иначе некорректная интерпретация"

  phosphorus:
    name: "Фосфор"
    unit: ммоль/л
    lab_ref: [0.81, 1.45]
    optimal: [1.0, 1.3]
    evidence: "B"
    notes: "Высокий фосфор при ХБП — сосудистая кальцификация. Ca × P > 4.4 ммоль²/л² — риск кальциноза. ГР может повышать. Низкий P — истощение, мальабсорбция"

  magnesium_serum:
    name: "Магний сывороточный"
    unit: ммоль/л
    lab_ref: [0.66, 1.07]
    optimal: [0.85, 1.00]
    evidence: "B"
    notes: "Сывороточный Mg — нечувствительный маркер (99% Mg внутриклеточно). Клинический дефицит возможен при норме. Симптомы: судороги, аритмии, бессонница. RBC Mg или ионизированный — точнее"

  albumin:
    name: "Альбумин"
    unit: г/л
    lab_ref: [35, 52]
    optimal: [42, 50]
    critical_low: 30
    evidence: "A"
    notes: "Интегральный маркер питания + печени. Нужен для corrected Ca. Низкий альбумин → псевдо-гипокальциемия, псевдо-низкий тироксин (связанный). Отёки при <25"

  # ── Electrolytes (for anion gap + osmolarity) ──
  sodium:
    name: "Натрий"
    unit: ммоль/л
    lab_ref: [136, 145]
    optimal: [138, 143]
    critical_high: 150
    critical_low: 130
    evidence: "A"
    notes: "Гипернатриемия (>145) = дегидратация, несахарный диабет, избыточный альдостерон. ГР+ТЗТ → задержка Na/воды. На диуретиках может падать. При потере >3 ммоль/л от baseline — проверить гидратацию"

  potassium:
    name: "Калий"
    unit: ммоль/л
    lab_ref: [3.5, 5.1]
    optimal: [4.0, 4.8]
    critical_high: 5.5
    critical_low: 3.3
    evidence: "A"
    notes: "Ложное ↑ при гемолизе (проверить на гемолиз!) и при сжатии турникетом >1 мин. На калий-сберегающих диуретиках и ингибиторах АПФ — повышается. Петлевые диуретики, рвота, диарея — снижают"

  chloride:
    name: "Хлориды"
    unit: ммоль/л
    lab_ref: [98, 107]
    optimal: [100, 106]
    evidence: "B"
    notes: "Движется параллельно Na. Нужен для anion gap. Высокий Cl при гиперхлоремическом ацидозе"

  bicarbonate:
    name: "Бикарбонат (HCO3)"
    unit: ммоль/л
    lab_ref: [22, 29]
    optimal: [23, 27]
    evidence: "A"
    notes: "Нужен для anion gap. Низкий HCO3 + высокий anion gap = метаболический ацидоз (диабетический кетоацидоз, лактат-ацидоз, уремия, отравления). Высокий HCO3 = метаболический алкалоз"

  # ── Red blood cell indices (anemia classification) ──
  mcv:
    name: "MCV (средний объём эритроцита)"
    unit: фл
    lab_ref: [80, 100]
    optimal: [85, 95]
    evidence: "A"
    notes: "Классификация анемии: MCV <80 микроцитарная (железо, талассемия), 80-100 нормоцитарная (кровопотеря, хроническое воспаление, почки), >100 макроцитарная (B12, фолиевая, гипотиреоз, алкоголь, MDS)"

  mch:
    name: "MCH (среднее содержание Hb в эритроците)"
    unit: пг
    lab_ref: [27, 33]
    optimal: [28, 32]
    evidence: "B"
    notes: "Следует за MCV. Низкий MCH + низкий MCV — гипохромия (железодефицит)"

  rdw:
    name: "RDW (ширина распределения эритроцитов)"
    unit: "%"
    lab_ref: [11.5, 14.5]
    optimal: [11.5, 13.5]
    evidence: "A"
    notes: "РАННИЙ маркер железодефицита — растёт раньше снижения гемоглобина. Смешанная анемия (железо + B12) → высокий RDW + нормальный или высокий MCV. RDW > 15% при любой анемии — комбинированный дефицит"

  reticulocytes:
    name: "Ретикулоциты"
    unit: "%"
    lab_ref: [0.5, 2.5]
    optimal: [0.8, 2.0]
    evidence: "B"
    notes: "Ответ костного мозга. При анемии с низкими ретикулоцитами (<1%) — угнетение кроветворения (железо, B12, почки, костный мозг). С высокими (>2.5%) — гемолиз, острая кровопотеря"

  # ── Hormones — additions ──
  testosterone_free:
    name: "Тестостерон свободный"
    unit: пмоль/л
    lab_ref_male: [150, 650]
    optimal_male: [300, 550]
    evidence: "B"
    notes: "Клинически значимее общего при аномальном SHBG. Cut-off для гипогонадизма: <225 пмоль/л. На ТЗТ считаем вместе с общим и SHBG. Метод: equilibrium dialysis — золотой стандарт, иммуноанализ — часто завышает"

  estradiol_sensitive:
    name: "Эстрадиол sensitive (LC-MS/MS)"
    unit: пг/мл
    lab_ref_male: [8, 35]
    optimal_male: [20, 30]
    evidence: "A"
    notes: "ОБЫЧНЫЙ иммуноанализ E2 у мужчин сильно неточен (×2-3 завышение). Sensitive E2 через масс-спектрометрию — единственный надёжный метод. При ТЗТ настаивай на sensitive E2 method"

  dhea_s:
    name: "ДЭА-С (DHEA-S)"
    unit: мкмоль/л
    lab_ref_male_40_50: [2.0, 10.0]
    optimal_male_40_50: [5.0, 9.0]
    evidence: "B"
    notes: "Надпочечниковый андроген. Снижается с возрастом (пик 25-30). Низкий DHEA-S — andropause / стресс / надпочечниковое истощение. Высокий — CAH (врождённая гиперплазия), опухоль надпочечника"

  cortisol_am:
    name: "Кортизол утренний (8:00-9:00)"
    unit: нмоль/л
    lab_ref: [170, 540]
    optimal: [280, 480]
    critical_low: 140
    critical_high: 600
    evidence: "A"
    notes: "СТРОГО в 8-9 утра, натощак, 15 мин покоя до забора. Низкий AM кортизол — надпочечниковая недостаточность (проверь ACTH, Synacthen test). Высокий — синдром Кушинга (24h urine free cortisol, dex-тест)"

  cortisol_pm:
    name: "Кортизол вечерний (22:00-23:00)"
    unit: нмоль/л
    lab_ref: [50, 270]
    optimal: [50, 180]
    evidence: "B"
    notes: "Утраченная циркадная ритмика (PM/AM ratio > 0.5) — ранний маркер Кушинга или хронического стресса. Слюнной PM кортизол удобнее"

  igfbp3:
    name: "IGFBP-3 (связывающий белок)"
    unit: мг/л
    lab_ref: [3.3, 6.7]
    optimal: [4.0, 6.0]
    evidence: "B"
    notes: "Основной транспортёр IGF-1. Мониторить ВМЕСТЕ с IGF-1 на ГР. Ratio IGF-1/IGFBP-3 (молярный) — биодоступный IGF-1. Низкий IGFBP-3 при нормальном IGF-1 = повышена биоактивность"

  # ── Lipid panel (missing previously) ──
  total_cholesterol:
    name: "Общий холестерин"
    unit: ммоль/л
    lab_ref: [3.0, 5.2]
    optimal: [3.5, 5.0]
    evidence: "A"
    notes: "ТЗТ + орал. АС снижают ЛПВП и повышают ЛПНП. На ГР — нейтральный или положительный эффект"

  ldl:
    name: "ЛПНП (LDL)"
    unit: ммоль/л
    lab_ref: [0, 3.3]
    optimal: [0, 2.6]
    critical_high: 4.1
    evidence: "A"
    notes: "Для вторичной профилактики цель <1.8. Оральные АС резко повышают (до +50%). Пересдавать каждые 3 мес на курсе"

  hdl:
    name: "ЛПВП (HDL)"
    unit: ммоль/л
    lab_ref_male: [0.9, 2.0]
    optimal_male: [1.2, 2.0]
    critical_low: 0.9
    evidence: "A"
    notes: "ТЗТ снижает до -20%. Орал. АС — до -50%. Низкий HDL = независимый кардиориск. Никотиновая кислота, Omega-3, физактивность — повышают"

  triglycerides:
    name: "Триглицериды"
    unit: ммоль/л
    lab_ref: [0, 1.7]
    optimal: [0, 1.1]
    critical_high: 2.3
    evidence: "A"
    notes: "Натощак 12ч. Алкоголь, фруктоза, углеводы повышают. ГР повышает острый (первые 2-4 нед), потом нормализация. >5.6 — риск панкреатита"

  apob:
    name: "Аполипопротеин B (апоВ)"
    unit: г/л
    lab_ref: [0.60, 1.33]
    optimal: [0.6, 0.9]
    critical_high: 1.3
    evidence: "A"
    notes: "Лучший маркер атерогенных частиц чем ЛПНП (учитывает размер частиц). Дискордантность ЛПНП/апоВ: у 20% пациентов ЛПНП нормальный, апоВ высокий — скрытый риск"

  lipoprotein_a:
    name: "Липопротеин (а) — Lp(a)"
    unit: мг/дл
    lab_ref: [0, 30]
    optimal: [0, 20]
    critical_high: 50
    evidence: "A"
    notes: "Генетически определён, сдаётся ОДИН раз в жизни. >50 мг/дл = 2× кардиориск независимо от ЛПНП. Статины не снижают. Снижают: ниацин (спорно), PCSK9 ингибиторы, apheresis"

  # ── Inflammation / coagulation ──
  fibrinogen:
    name: "Фибриноген"
    unit: г/л
    lab_ref: [2.0, 4.0]
    optimal: [2.0, 3.2]
    evidence: "B"
    notes: "Острофазовый + фактор свёртывания. Высокий на ТЗТ + высокий гематокрит = ↑ риск тромбоза. Снижают: Omega-3, никотиновая кислота, физактивность"

  d_dimer:
    name: "D-димер"
    unit: нг/мл FEU
    lab_ref: [0, 500]
    optimal: [0, 250]
    evidence: "A"
    notes: "Высокий при тромбозе, воспалении, беременности, раке. Возраст-скорректированная норма: возраст×10 нг/мл для >50 лет. У молодых <250 — практически исключает активный тромб"

# ── Diagnostic heuristics (рассчитываемые соотношения и формулы) ──
heuristics:
  de_ritis_ratio:
    name: "De Ritis (АСТ/АЛТ)"
    formula: "АСТ / АЛТ"
    interpretation:
      "< 1":   "Вирусный гепатит, НАЖБП, лекарственный гепатит (DILI)"
      "1 - 2": "Неспецифическое поражение"
      "> 2":   "Алкогольная болезнь печени, цирроз, рабдомиолиз (проверь КФК+ЛДГ)"
      "> 4":   "Фульминантная печёночная недостаточность — экстренно"
    evidence: "A"
    notes: "Самая полезная heuristic при гепатопатии. Intercept с другими маркерами: высокий ГГТ + АСТ/АЛТ>2 = алкоголь. Норм. ГГТ + АСТ/АЛТ>2 = мышечное (посттренировочное, рабдомиолиз)"

  bun_creatinine_ratio:
    name: "Мочевина / креатинин"
    formula: "мочевина (ммоль/л × 2.8) / креатинин (мкмоль/л) × 100 — в амер. единицах BUN/Cr"
    interpretation:
      "< 10": "Ренальная причина — внутрипочечное повреждение"
      "10 - 20": "Норма"
      "> 20": "Преренальная причина — дегидратация, ЖКТ-кровотечение, катаболизм"
    evidence: "A"
    notes: "У мужчины на высокобелковой диете + ТЗТ + креатин baseline в верхней норме. Для дифференциации обезвоживания vs ренального повреждения"

  anion_gap:
    name: "Анионный промежуток"
    formula: "Na − (Cl + HCO3)"
    normal_range: [8, 12]
    interpretation:
      "high (>12)":  "Метаболический ацидоз с высоким AG: кетоацидоз (диабет, голодание), лактат-ацидоз (сепсис, физнагрузка), уремия, отравления (метанол, этиленгликоль, салицилаты)"
      "normal":      "Гиперхлоремический ацидоз: потеря HCO3 (диарея, РТА)"
    evidence: "A"
    notes: "Корректировка на альбумин: AG_corrected = AG + 2.5 × (40 − альбумин_г/л)"

  corrected_calcium:
    name: "Скорректированный кальций"
    formula: "Ca_total + 0.02 × (40 − альбумин_г/л)"
    evidence: "A"
    notes: "При гипоальбуминемии total Ca неинтерпретируем. Гораздо лучше — ионизированный Ca, если доступен"

  mcv_anemia_classification:
    name: "Классификация анемии по MCV"
    interpretation:
      "MCV < 80":   "Микроцитарная: железодефицит (↓ферритин, ↑RDW), талассемия (норм. ферритин, ↓MCV несоответственно), анемия хрон. болезней, свинец"
      "MCV 80-100": "Нормоцитарная: острая кровопотеря, ранний железодефицит, воспаление, почечная (ЭПО), смешанная"
      "MCV > 100":  "Макроцитарная: B12 дефицит (↑гомоцистеин, ↑MMA), фолиевой кислоты, гипотиреоз, алкоголь, MDS, лек. (метотрексат, фенитоин)"
    evidence: "A"

  egfr_ckd_epi:
    name: "eGFR по CKD-EPI (2021 без расы)"
    formula: "сложная — используй онлайн-калькулятор или библиотеку"
    interpretation:
      "> 90":   "G1 — норма (с альбуминурией — ХБП)"
      "60-89":  "G2 — слегка снижена"
      "45-59":  "G3a — умеренно"
      "30-44":  "G3b — сильнее"
      "15-29":  "G4 — тяжёлая"
      "< 15":   "G5 — почечная недостаточность"
    notes: "При высокой мышечной массе eGFR по креатинину искажён — считать дополнительно по цистатину C (формула CKD-EPI cystatin) или combined (самая точная)"

  homa_ir:
    name: "HOMA-IR (инсулинорезистентность)"
    formula: "глюкоза_ммоль/л × инсулин_мкМЕ/мл / 22.5"
    interpretation:
      "< 1.0":   "Хорошая чувствительность к инсулину"
      "1.0-2.5": "Норма"
      "2.5-5.0": "Ранняя инсулинорезистентность"
      "> 5.0":   "Выраженная"
    evidence: "A"

  fib4_index:
    name: "FIB-4 (скрининг фиброза печени)"
    formula: "возраст × АСТ / (тромбоциты × √АЛТ)"
    interpretation:
      "< 1.3":  "Низкая вероятность значимого фиброза"
      "1.3-2.67": "Серая зона — эластометрия"
      "> 2.67": "Высокая вероятность, направление к гепатологу"
    evidence: "A"
    notes: "Простой неинвазивный скрининг НАЖБП-фиброза. Проверять всем с АЛТ>40 или метаболическим синдромом"

  osmolarity_calculated:
    name: "Осмолярность расчётная"
    formula: "2 × Na + глюкоза/18 + мочевина/2.8"
    normal_range: [275, 295]
    notes: "Нужна при подозрении на дегидратацию / отравления / СИАДГ"

# ── Lab artifacts (ложные значения, не интерпретировать как патологию) ──
lab_artifacts:
  hemolysis:
    affects: [potassium, ldh, ast, iron]
    pattern: "↑ K, ↑ ЛДГ, ↑ АСТ, ↑ железо — одновременно, при норм. АЛТ и гемоглобине"
    advice: "Переснять. Причины: тугой турникет, тонкая игла, тряска пробирки, задержка доставки"

  lipemia:
    affects: [sodium, phosphorus, bilirubin]
    pattern: "↓ Na (псевдо-гипонатриемия), интерференция фотометрии"
    advice: "При высоких ТГ (>5 ммоль/л) — ионоселективный метод для Na, ручной биохим"

  tourniquet_prolonged:
    affects: [calcium, potassium, total_protein, hemoglobin]
    pattern: "Турникет > 1 мин → гемоконцентрация → ложно ↑ Ca, K, белок, Hb"
    advice: "Турникет снимать сразу после пункции вены"

  wrong_sampling_time:
    examples:
      - "Тестостерон на ТЗТ — строго trough (за 1 день до инъекции), а не сразу после"
      - "Кортизол — 8-9 утра для утреннего, 22-23 для вечернего"
      - "Пролактин — 2-3 часа после пробуждения (не сразу)"
      - "АСТ/КФК — 48ч отдыха от тренировок"
      - "Гомоцистеин — строго натощак"

  muscle_mass_inflates_creatinine:
    affects: [creatinine, egfr]
    pattern: "Креатинин в верхней норме + низкий цистатин C + высокая мышечная масса"
    advice: "Не паниковать. Истинная почечная функция — по цистатину C"

  creatine_supplementation:
    affects: [creatinine]
    pattern: "+10-30 мкмоль/л от baseline при приёме креатина моногидрата"
    advice: "Отменить за 2 недели до анализа ИЛИ сдать цистатин C"

# ── Age-based cancer screening (males, to be cross-checked against RU Минздрав №124н + USPSTF) ──
cancer_screening:
  general:
    "ПСА общий + свободный":
      start_age: 40
      frequency: "Ежегодно при наличии факторов риска (ТЗТ, отягощённый анамнез), иначе с 45-50"
      notes: "ТЗТ не вызывает рак простаты, но может ускорить рост существующего. Baseline ПСА ОБЯЗАТЕЛЕН перед стартом ТЗТ"
    "Колоноскопия":
      start_age: 45
      frequency: "1 раз в 10 лет или FIT ежегодно. Раньше — при отягощённом анамнезе"
    "Дерматоскопия":
      start_age: 30
      frequency: "Ежегодно при большом количестве родинок или солнечных ожогах в анамнезе"
    "УЗИ щитовидки":
      start_age: 40
      frequency: "1 раз в 3-5 лет"
    "КТ грудной клетки низкодозная":
      start_age: 50
      frequency: "Ежегодно для курильщиков (стаж >20 пачкалет) или с профессиональной вредностью"
    "ЭхоКГ + коронарный Ca-score":
      start_age: 45
      frequency: "1 раз в 5 лет, раньше при факторах риска"
    "Денситометрия (DXA)":
      start_age: 50
      frequency: "1 раз в 2 года у мужчин с хрон. стероидами, ТЗТ + GH цикл — baseline обязателен"

  trt_specific:
    "УЗИ яичек":
      frequency: "Ежегодно на ТЗТ"
      reason: "ТЗТ + ХГЧ могут маскировать опухоль. Атрофия vs масса — пальпация + УЗИ"
    "Маммография / УЗИ молочных желёз":
      frequency: "При гинекомастии или подозрении"
      reason: "E2 + пролактин могут провоцировать рост ткани"
    "Гематокрит + ферритин":
      frequency: "Каждые 3 мес на ТЗТ"
      reason: "Эритроцитоз — самая частая побочка ТЗТ"
